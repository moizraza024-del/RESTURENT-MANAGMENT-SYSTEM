{% extends 'base.html' %}
{% block title %}Admin Categories - Sugar Blush{% endblock %}
{% block content %}
<h2>Categories</h2>
<form method="post" class="row g-3 mb-3"><div class="col-md-8"><input class="form-control" name="name" placeholder="Category Name" required></div><div class="col-md-4"><button class="btn btn-primary">Add Category</button></div></form>
<table class="table"><thead><tr><th>Name</th><th>Action</th></tr></thead><tbody>{% for c in categories %}<tr><td>{{ c.name }}</td><td><a class="btn btn-sm btn-danger" href="{{ url_for('delete_category', category_id=c.id) }}">Delete</a></td></tr>{% endfor %}</tbody></table>
{% endblock %}
