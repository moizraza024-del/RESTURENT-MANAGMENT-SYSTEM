{% extends 'base.html' %}
{% block title %}Admin Banners - Sugar Blush{% endblock %}
{% block content %}
<h2>Promotion Banners</h2>
<form method="post" enctype="multipart/form-data" class="row g-3 mb-3">
  <div class="col-md-4"><input class="form-control" name="image" placeholder="Image URL"></div>
  <div class="col-md-4"><input class="form-control" type="file" name="image_file" accept="image/*"></div>
  <div class="col-md-3"><select class="form-select" name="category_id"><option value="">No Category</option>{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div>
  <div class="col-md-1 text-center"><div class="form-check mt-2"><input class="form-check-input" type="checkbox" name="active" id="active" checked><label class="form-check-label" for="active">Active</label></div></div>
  <div class="col-md-12"><button class="btn btn-primary">Add Banner</button></div>
</form>
  <thead><tr><th>Image</th><th>Category</th><th>Active</th><th>Action</th></tr></thead><tbody>{% for b in banners %}<tr><td><img src="{{ b.image }}" width="120"></td><td>{{ b.category.name if b.category else 'All' }}</td><td>{{ 'Yes' if b.active else 'No' }}</td><td><a class="btn btn-sm btn-warning" href="{{ url_for('toggle_banner', banner_id=b.id) }}">Toggle</a>
          <form method="get" action="{{ url_for('delete_banner', banner_id=b.id) }}" class="d-inline ms-1" onsubmit="return confirm('Delete this banner?');">
            <button type="submit" class="btn btn-sm btn-danger">Remove</button>
          </form>
        </td></tr>{% endfor %}</tbody></table>
{% endblock %}
