{% extends 'base.html' %}
{% block title %}Edit Product - Sugar Blush{% endblock %}
{% block content %}
<h2>Edit Product: {{ product.name }}</h2>
<form method="post" enctype="multipart/form-data" class="row g-3">
  <div class="col-md-6">
    <label class="form-label">Product Name</label>
    <input class="form-control" name="name" value="{{ product.name }}" type="text" required>
  </div>
  <div class="col-md-6">
    <label class="form-label">Category</label>
    <select class="form-select" name="category_id" required>
      <option value="">Select Category</option>
      {% for c in categories %}
      <option value="{{ c.id }}" {% if product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-12">
    <label class="form-label">Description</label>
    <textarea class="form-control" name="description" rows="3" required>{{ product.description }}</textarea>
  </div>
  <div class="col-md-4">
    <label class="form-label">Sale Price</label>
    <input class="form-control" name="sale_price" value="{{ product.sale_price }}" type="number" step="0.01" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">Making Cost</label>
    <input class="form-control" name="making_cost" value="{{ product.making_cost }}" type="number" step="0.01" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">Discount %</label>
    <input class="form-control" name="discount" value="{{ product.discount }}" type="number" step="0.01" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">Stock</label>
    <input class="form-control" name="stock" value="{{ product.stock or 0 }}" type="number" min="0" step="1" required>
  </div>
  <div class="col-md-6">
    <label class="form-label">Image URL (optional)</label>
    <input class="form-control" name="image" value="{{ product.image }}" type="text" placeholder="https://...">
  </div>
  <div class="col-md-6">
    <label class="form-label">Image File (optional)</label>
    <input class="form-control" type="file" name="image_file" accept="image/*">
  </div>
  <div class="col-md-6">
    <div class="form-check mt-3">
      <input class="form-check-input" type="checkbox" id="is_active" name="is_active" {% if product.is_active %}checked{% endif %}>
      <label class="form-check-label" for="is_active">Show on Website</label>
    </div>
  </div>
  {% if product.image %}
  <div class="col-md-12 mb-2">
    <label class="form-label">Current Image</label><br>
    <img src="{{ product.image }}" class="img-fluid" style="max-height:200px;" alt="Product image">
  </div>
  {% endif %}
  <div class="col-md-12">
    <button class="btn btn-primary">Update Product</button>
    <a href="{{ url_for('admin_products') }}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
